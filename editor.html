<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clip a file - Download Video OSS</title>
<style>
  html, body { height: 100%; margin: 0; background: #0b1220; color: #fff; font: 14px system-ui, sans-serif; }
  .wrap { height: 100%; display: grid; place-items: center; }
  .drop { width: min(560px, 90vw); padding: 40px 28px; border: 2px dashed #374151; border-radius: 14px; background: #111827; text-align: center; }
  .drop.over { border-color: #e11d74; background: #17202f; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { opacity: .7; margin: 0 0 18px; line-height: 1.5; }
  button { background: #e11d74; border: 0; color: #fff; border-radius: 9px; padding: 11px 18px; font: 600 14px system-ui; cursor: pointer; }
  button:hover { background: #f0307f; }
  .status { margin-top: 14px; font: 12px ui-monospace, monospace; opacity: .85; min-height: 16px; }
  .status.err { color: #f87171; } .status.ok { color: #4ade80; }
  input[type=file] { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="drop" id="drop">
      <h1>Clip a file from your computer</h1>
      <p>Trim it, convert it to MP4, WebM, GIF or audio, or aim for a file size.<br>Nothing is uploaded: the file is read here and processed in this browser.</p>
      <button id="pick">Choose a video file</button>
      <input id="file" type="file" accept="video/*,audio/*,.mp4,.webm,.mkv,.mov,.m4v,.ts,.m4a,.mp3">
      <div id="status" class="status">or drop a file anywhere on this page</div>
    </div>
  </div>
  <script src="core/clipmodal.js"></script>
  <script src="editor.js"></script>
</body>
</html>
